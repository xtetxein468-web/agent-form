<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWE KAUNG - Agent Registration</title>
    
    <!-- Browser Tab Icon (Favicon) ထည့်သွင်းခြင်း -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { 
            max-width: 550px; 
            width: 100%;
            background: rgba(255, 255, 255, 0.96); 
            padding: 35px 30px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(10px);
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #203a43;
            padding-bottom: 12px;
        }
        .header-title .logo {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #1e3c72;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            background-color: #ffffff;
            flex-shrink: 0;
        }
        .header-title h2 { 
            color: #0f2027; 
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .form-group { 
            margin-bottom: 20px; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #333;
            font-size: 14px;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #cccccc; 
            border-radius: 8px; 
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #203a43;
            box-shadow: 0 0 8px rgba(32, 58, 67, 0.25);
            background: #ffffff;
        }
        button { 
            background: linear-gradient(135deg, #11998e, #38ef7d); 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 8px; 
            font-size: 17px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        button:disabled {
            background: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <img src="logo.png" alt="PWE KAUNG Logo" class="logo">
        <h2>Football Site Agent လျှောက်လွှာ</h2>
    </div>
    
    <form id="agentForm">
        <div class="form-group">
            <label>အမည် *</label>
            <input type="text" id="name" required placeholder="သင့်အမည် ရိုက်ထည့်ပါ">
        </div>
        <div class="form-group">
            <label>ဖုန်းနံပါတ် *</label>
            <input type="tel" id="phone" required placeholder="09xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Facebook Account Link / Profile Name *</label>
            <input type="text" id="fbLink" required placeholder="https://facebook.com/yourprofile">
        </div>
        <div class="form-group">
            <label>အေးဂျင့်လုပ်ဖူးခြင်း အတွေ့အကြုံ</label>
            <select id="experience">
                <option value="မရှိဖူးပါ">မရှိဖူးပါ (နားလည်အောင် သင်ယူမည်)</option>
                <option value="၁ နှစ်အောက်">၁ နှစ်အောက်</option>
                <option value="၁ နှစ်ထက်မက">၁ နှစ်ထက်မက (အတွေ့အကြုံရှိ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>ဖြည့်စွက်ပြောကြားလိုသည့် အချက်များ</label>
            <textarea id="note" rows="3" placeholder="ဖြည့်စွက်လိုသည်များကို ရေးသားနိုင်ပါသည်"></textarea>
        </div>
        <button type="submit" id="submitBtn">လျှောက်လွှာ တင်မည်</button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvMyzodRLDoGvKzvmTRUFhCgzknzGTwJkmTWPXVQfgXjKGuiTCBmen57Yh3bpgh-8P/exec";

    document.getElementById('agentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "ခဏစောင့်ပါ...";

        const formData = new URLSearchParams();
        formData.append('name', document.getElementById('name').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('fbLink', document.getElementById('fbLink').value);
        formData.append('experience', document.getElementById('experience').value);
        formData.append('note', document.getElementById('note').value);

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            alert("လျှောက်လွှာ အောင်မြင်စွာ ပေးပို့ပြီးပါပြီ။");
            document.getElementById('agentForm').reset();
        })
        .catch(err => alert("အမှားတစ်ခု ဖြစ်ပေါ်နေပါသည်။ ပြန်လည် ကြိုးစားပါ။"))
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "လျှောက်လွှာ တင်မည်";
        });
    });
</script>

</body>
</html>
