<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Agent Registration</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Football Site Agent လျှောက်လွှာ</h2>
    <form id="agentForm">
        <div class="form-group">
            <label>အမည် *</label>
            <input type="text" id="name" required placeholder="သင့်အမည် ရိုက်ထည့်ပါ">
        </div>
        <div class="form-group">
            <label>ဖုန်းနံပါတ် *</label>
            <input type="tel" id="phone" required placeholder="09xxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Facebook Account Link / Profile Name *</label>
            <input type="text" id="fbLink" required placeholder="https://facebook.com/yourprofile">
        </div>
        <div class="form-group">
            <label>အေးဂျင့်လုပ်ဖူးခြင်း အတွေ့အကြုံ</label>
            <select id="experience">
                <option value="မရှိဖူးပါ">မရှိဖူးပါ (နားလည်အောင် သင်ယူမည်)</option>
                <option value="၁ နှစ်အောက်">၁ နှစ်အောက်</option>
                <option value="၁ နှစ်ထက်မက">၁ နှစ်ထက်မက (အတွေ့အကြုံရှိ)</option>
            </select>
        </div>
        <div class="form-group">
            <label>ဖြည့်စွက်ပြောကြားလိုသည့် အချက်များ</label>
            <textarea id="note" rows="3"></textarea>
        </div>
        <button type="submit" id="submitBtn">လျှောက်လွှာ တင်မည်</button>
    </form>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvMyzodRLDoGvKzvmTRUFhCgzknzGTwJkmTWPXVQfgXjKGuiTCBmen57Yh3bpgh-8P/exec";
    document.getElementById('agentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "ခဏစောင့်ပါ...";

        const formData = new URLSearchParams();
        formData.append('name', document.getElementById('name').value);
        formData.append('phone', document.getElementById('phone').value);
        formData.append('fbLink', document.getElementById('fbLink').value);
        formData.append('experience', document.getElementById('experience').value);
        formData.append('note', document.getElementById('note').value);

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            alert("လျှောက်လွှာ အောင်မြင်စွာ ပေးပို့ပြီးပါပြီ။");
            document.getElementById('agentForm').reset();
        })
        .catch(err => alert("အမှားတစ်ခု ဖြစ်ပေါ်နေပါသည်။ ပြန်လည် ကြိုးစားပါ။"))
        .finally(() => {
            btn.disabled = false;
            btn.innerText = "လျှောက်လွှာ တင်မည်";
        });
    });
</script>
</body>
</html>
