<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #1e3c72; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .login-box { max-width: 350px; margin: 50px auto; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; }
        button { background: #1e3c72; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="login-box">
        <h2>Owner Dashboard</h2>
        <input type="password" id="passcode" placeholder="Passcode ရိုက်ထည့်ပါ">
        <button onclick="checkPasscode()">Login</button>
    </div>

    <div id="dataSection" style="display: none;">
        <h2>Agent လျှောက်ထားသူများ စာရင်း</h2>
        <button onclick="fetchData()">စာရင်း အသစ်ပြန်ယူရန် (Refresh)</button>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>ရက်စွဲ</th>
                        <th>အမည်</th>
                        <th>ဖုန်းနံပါတ်</th>
                        <th>FB Link</th>
                        <th>အတွေ့အကြုံ</th>
                        <th>အသေးစိတ်</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const PASSCODE = "1234";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwpRGVqRDqfhFnMUCGTtCJsmWem2Bc7lsKXi98iX4z66Dz6D7_gmBFyq9iWqICKl6mjlw/exec";

    function checkPasscode() {
        if (document.getElementById('passcode').value === PASSCODE) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dataSection').style.display = 'block';
            fetchData();
        } else {
            alert("Passcode မှားယွင်းနေပါသည်။");
        }
    }

    function fetchData() {
        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            for(let i = 1; i < data.length; i++) {
                const row = `<tr>
                    <td>${i}</td>
                    <td>${new Date(data[i][0]).toLocaleString()}</td>
                    <td><b>${data[i][1]}</b></td>
                    <td><a href="tel:${data[i][2]}">${data[i][2]}</a></td>
                    <td><a href="${data[i][3]}" target="_blank">Link ကြည့်မည်</a></td>
                    <td>${data[i][4]}</td>
                    <td>${data[i][5] || '-'}</td>
                </tr>`;
                tbody.innerHTML += row;
            }
        });
    }
</script>
</body>
</html>
