<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #1e3c72; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .login-box { max-width: 350px; margin: 50px auto; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #1e3c72; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .loading { text-align: center; color: #666; font-weight: bold; padding: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loginSection" class="login-box">
        <h2>Owner Dashboard</h2>
        <input type="password" id="passcode" placeholder="Passcode ရိုက်ထည့်ပါ">
        <button onclick="checkPasscode()">Login</button>
    </div>

    <div id="dataSection" style="display: none;">
        <h2>Agent လျှောက်ထားသူများ စာရင်း</h2>
        <button onclick="fetchData()">စာရင်း အသစ်ယူရန် (Refresh)</button>
        <div id="statusMessage" class="loading" style="display:none;">စာရင်းများ ဆွဲယူနေပါသည်...</div>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ရက်စွဲ</th>
                        <th>အမည်</th>
                        <th>ဖုန်းနံပါတ်</th>
                        <th>FB Link</th>
                        <th>အတွေ့အကြုံ</th>
                        <th>မှတ်ချက်</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3kVR_63i9rK5tT8Go9tmrOD027lhqUT4gqkrlIWXkmhW_J0Sq9SqZZOSsZS3NN2fjsA/exec";
    const OWNER_PASSCODE = "1234";

    function checkPasscode() {
        const input = document.getElementById('passcode').value;
        if (input === OWNER_PASSCODE) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dataSection').style.display = 'block';
            fetchData();
        } else {
            alert("Passcode မှားယွင်းနေပါသည်။");
        }
    }

    function fetchData() {
        const statusMsg = document.getElementById('statusMessage');
        statusMsg.style.display = 'block';
        statusMsg.innerText = 'စာရင်းများ ဆွဲယူနေပါသည်...';

        fetch(SCRIPT_URL, {
            method: 'GET',
            redirect: 'follow'
        })
        .then(res => {
            if (!res.ok) {
                throw new Error("Network response was not ok");
            }
            return res.json();
        })
        .then(data => {
            statusMsg.style.display = 'none';
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';
            
            if (!data || data.length <= 1) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">စာရင်းများ မရှိသေးပါ</td></tr>';
                return;
            }

            // Skip row 0 (Headers)
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                const tr = document.createElement('tr');
                
                let dateStr = row[0] ? new Date(row[0]).toLocaleString('my-MM') : '';
                
                tr.innerHTML = `
                    <td>${dateStr}</td>
                    <td>${row[1] || ''}</td>
                    <td>${row[2] || ''}</td>
                    <td><a href="${row[3]}" target="_blank" rel="noopener">${row[3] || ''}</a></td>
                    <td>${row[4] || ''}</td>
                    <td>${row[5] || ''}</td>
                `;
                tbody.appendChild(tr);
            }
        })
        .catch(err => {
            console.error(err);
            statusMsg.style.display = 'block';
            statusMsg.innerText = 'စာရင်းဆွဲယူရာတွင် အမှားတစ်ခု ဖြစ်ပေါ်နေပါသည်။ Google Script Deployment URL မှန်မမှန် ပြန်စစ်ပေးပါ။';
        });
    }
</script>

</body>
</html>
